<main
  class="flex min-h-screen items-center justify-center
         bg-slate-950 px-4 py-12 text-white"
>
  <section
    class="w-full max-w-xl rounded-3xl border
           border-slate-800 bg-slate-900/90 p-8
           text-center shadow-2xl shadow-black/30
           sm:p-12"
    aria-labelledby="access-denied-title"
  >
    <div
      class="mx-auto flex size-20 items-center
             justify-center rounded-full border
             border-amber-400/30 bg-amber-400/10
             text-amber-300"
      aria-hidden="true"
    >
      <svg
        class="size-10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v3.75m9.303 3.376
             c.866 1.5-.217 3.374-1.948 3.374
             H4.645c-1.73 0-2.813-1.874-1.948-3.374
             L10.052 3.38c.865-1.5 3.03-1.5
             3.896 0l7.355 12.746ZM12 16.5h.008v.008
             H12V16.5Z"
        />
      </svg>
    </div>

    <p
      class="mt-6 text-sm font-semibold uppercase
             tracking-[0.25em] text-amber-300"
    >
      Error 403
    </p>

    <h1
      id="access-denied-title"
      class="mt-3 text-3xl font-bold tracking-tight
             sm:text-4xl"
    >
      Access denied
    </h1>

    <p
      class="mx-auto mt-4 max-w-md leading-7
             text-slate-400"
    >
      Your account does not have permission to access
      this page. If you believe this is a mistake,
      contact the system administrator.
    </p>

    <a
      routerLink="/profile"
      class="mt-8 inline-flex min-h-12 items-center
             justify-center rounded-xl bg-cyan-500
             px-6 py-3 font-semibold text-slate-950
             transition hover:bg-cyan-400
             focus-visible:outline-none
             focus-visible:ring-2
             focus-visible:ring-cyan-300
             focus-visible:ring-offset-2
             focus-visible:ring-offset-slate-900"
    >
      Go to my profile
    </a>
  </section>
</main>
