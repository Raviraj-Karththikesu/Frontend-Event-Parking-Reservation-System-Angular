<section
  class="flex min-h-48 flex-col items-center
         justify-center rounded-2xl border
         border-red-400/20 bg-red-400/5
         p-8 text-center"
  role="alert"
  aria-live="assertive"
>
  <div
    class="flex size-14 items-center justify-center
           rounded-full bg-red-400/10 text-red-300"
    aria-hidden="true"
  >
    <svg
      class="size-7"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 9v3.75m9.303 3.376
           c.866 1.5-.217 3.374-1.948 3.374
           H4.645c-1.73 0-2.813-1.874-1.948-3.374
           L10.052 3.38c.865-1.5 3.03-1.5
           3.896 0l7.355 12.746ZM12 16.5h.008
           v.008H12V16.5Z"
      />
    </svg>
  </div>

  <h2 class="mt-4 text-xl font-bold text-white">
    {{ title }}
  </h2>

  <p class="mt-2 max-w-lg leading-6 text-slate-400">
    {{ message }}
  </p>

  @if (showRetry) {
    <button
      type="button"
      class="mt-6 inline-flex min-h-11 items-center
             justify-center rounded-xl bg-red-500
             px-5 py-2.5 font-semibold text-white
             transition hover:bg-red-400
             focus-visible:outline-none
             focus-visible:ring-2
             focus-visible:ring-red-300
             focus-visible:ring-offset-2
             focus-visible:ring-offset-slate-900"
      (click)="retryRequest()"
    >
      Try again
    </button>
  }
</section>
